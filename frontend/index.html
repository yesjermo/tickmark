<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tickmark</title>
    <meta name="description" content="A trading desk that shows its reasons." />
    <meta name="theme-color" content="#e4e2dd" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tickmark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <script>
    // Apply the saved appearance before anything paints (System follows the computer; see Comfort.tsx).
    try {
      var g = function (k, d) { var v = localStorage.getItem("tickmark." + k); return v == null ? d : JSON.parse(v); };
      var m = g("mode", "system"), dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.palette = g("palette", "stone");
      document.documentElement.dataset.motion = g("motion", "full");
      document.documentElement.dataset.reveal = g("reveal", true) ? "on" : "off";
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
