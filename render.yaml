# Render blueprint for Tickmark (dashboard → New → Blueprint → this repo).
# Free plan: the instance sleeps after ~15 minutes idle and its disk is NOT persistent, so accounts, journals and
# linked keys are lost on every redeploy or restart. Fine for trying it out; move to a paid plan with a disk
# (or another host with a volume) before real clients rely on it. See README → Hosting.
services:
  - type: web
    name: tickmark
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SWINGDESK_PORTAL          # multi-user sign-in, per-user data and encrypted keys
        value: "on"
      - key: SWINGDESK_OPEN_SIGNUP     # invite-only: the admin hands out invite codes
        value: "off"
      - key: SWINGDESK_SETUP_CODE      # needed once, to create the admin account (read it in the Render dashboard)
        generateValue: true
      - key: SWINGDESK_MASTER_KEY      # encrypts each user's broker, exchange and AI keys
        generateValue: true
      - key: SWINGDESK_SECURE_COOKIES
        value: "on"
      - key: SWINGDESK_FREE_TIER       # free copilot plans; only offered once you also add a provider key below
        value: "off"
      # Optional, add in the dashboard (never commit them): ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY,
      # SWINGDESK_OSS_BASE_URL, broker OAuth client ids (SCHWAB_CLIENT_ID, ALPACA_OAUTH_CLIENT_ID, ...).
