# Render blueprint for Tickmark (dashboard → New → Blueprint → this repo).
# Free plan: the instance sleeps after ~15 minutes idle and its disk is wiped on every sleep, restart or redeploy.
# Set SWINGDESK_BACKUP_REPO + SWINGDESK_BACKUP_TOKEN and Tickmark keeps an encrypted backup in your private GitHub
# repo and restores it on every start, so accounts and data survive. See README → Hosting.
services:
  - type: web
    name: tickmark
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SWINGDESK_PORTAL          # multi-user sign-in, per-user data and encrypted keys
        value: "on"
      - key: SWINGDESK_OPEN_SIGNUP     # open to the public: anyone can create an account (the first admin still needs the setup code)
        value: "on"
      - key: SWINGDESK_BACKUP_REPO     # owner/name of a PRIVATE GitHub repo that holds the encrypted data backup
        sync: false
      - key: SWINGDESK_BACKUP_TOKEN    # fine-grained GitHub token: Contents read/write on that one repo only
        sync: false
      - key: SWINGDESK_SETUP_CODE      # needed once, to create the admin account (read it in the Render dashboard)
        generateValue: true
      - key: SWINGDESK_MASTER_KEY      # encrypts each user's broker, exchange and AI keys
        generateValue: true
      - key: SWINGDESK_SECURE_COOKIES
        value: "on"
      - key: SWINGDESK_FREE_TIER       # free copilot plans; only offered once you also add a provider key below
        value: "off"
      # Optional, add in the dashboard (never commit them): ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY
      # (a free AI Studio key works), SWINGDESK_OSS_BASE_URL + SWINGDESK_OSS_MODEL + SWINGDESK_OSS_API_KEY (e.g. Groq),
      # broker OAuth client ids (SCHWAB_CLIENT_ID, ALPACA_OAUTH_CLIENT_ID, ...).
